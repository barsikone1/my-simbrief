<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FlyBrief - Flight Planning</title>
    <style>
        body { font-family: 'Courier New', monospace; margin: 0; padding: 20px; background: #121212; color: #e0e0e0; }
        .wrapper { display: flex; gap: 20px; height: 92vh; width: 100%; }
        .panel { width: 420px; min-width: 420px; padding: 25px; background: #1a1a1a; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #2d2d2d; overflow-y: auto; box-sizing: border-box; }
        .map-box { flex-grow: 1; height: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #333; background: #1a1a1a; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        #static-map { max-width: 100%; max-height: 100%; border-radius: 4px; display: none; object-fit: contain; }
        .map-placeholder { color: #555; text-align: center; font-size: 16px; padding: 20px; }
        h2 { color: #ff9800; border-bottom: 2px solid #ff9800; padding-bottom: 10px; margin-top: 0; font-size: 22px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #b0b0b0; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; font-family: inherit; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        input:focus, select:focus { border-color: #ff9800; outline: none; }
        button { background: #ff9800; color: #000; border: none; cursor: pointer; font-weight: bold; font-size: 15px; }
        button:hover { background: #e08600; }
        .btn-download { background: #4caf50; color: #fff; display: none; }
        .btn-download:hover { background: #388e3c; }
        pre { background: #0c0c0c; color: #00ff00; padding: 15px; border-radius: 5px; font-size: 11px; border: 1px solid #222; overflow-x: auto; white-space: pre-wrap; box-shadow: inset 0 0 10px #000; }
        h3 { color: #ff9800; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="panel">
            <h2>FlyBrief Pro v2.5</h2>
            <label>Вылет (ICAO):</label>
            <input id="dep" value="ULLI">
            <label>Прилет (ICAO):</label>
            <input id="arr" value="UUWW">
            <label>Запасной (ICAO):</label>
            <input id="alt" value="UUEE">
            <label>Тип ВС (Самолет):</label>
            <select id="ac">
                <option value="B738">Boeing 737-800</option>
                <option value="A20N">Airbus A320neo</option>
                <option value="B77W">Boeing 777-300ER</option>
                <option value="C172">Cessna 172 Skyhawk</option>
            </select>
            <button onclick="calc()">СГЕНЕРИРОВАТЬ OFP</button>
            <button id="dl_btn" class="btn-download" onclick="downloadPlan()">СКАЧАТЬ ПЛАН (.PLN)</button>
            <div id="res" style="display:none">
                <h3>Operational Flight Plan (OFP):</h3>
                <pre id="ofp_block"></pre>
            </div>
        </div>
        <div class="map-box">
            <div id="placeholder-text" class="map-placeholder">Введите данные рейса и нажмите кнопку для прокладки трассы...</div>
            <img id="static-map" alt="Навигационная карта маршрута" />
        </div>
    </div>

    <script>
        async function calc() {
            const d = document.getElementById("dep").value.toUpperCase().trim();
            const a = document.getElementById("arr").value.toUpperCase().trim();
            const alt = document.getElementById("alt").value.toUpperCase().trim();
            const c = document.getElementById("ac").value;
            
            try {
                const res = await fetch(`/calculate?dep=${d}&arr=${a}&alt=${alt}&ac=${c}`);
                if (!res.ok) return;
                const data = await res.json();
                
                // Добавляем автоматический подбор эшелона прямо на фронтенде для наглядности
                let crz_alt = "FL360";
                if (c === "C172") crz_alt = "5000 FT";
                else {
                    // Полукомплиментарная система: курс на восток/запад
                    const isEastbound = data.path[data.path.length-1].lon > data.path[0].lon;
                    crz_alt = isEastbound ? "FL350 (ODD)" : "FL360 (EVEN)";
                }
                
                // Интегрируем расчетную высоту в бриф
                let updated_text = data.ofp_text.replace(
                    "CRUISE ALTITUDE:", "CRUISE ALTITUDE:"
                );
                if (!updated_text.includes("CRUISE ALTITUDE")) {
                    updated_text = updated_text.replace(
                        "ROUTE LOG:", 
                        `CRUISE ALTITUDE: ${crz_alt}\n  ROUTE LOG:`
                    );
                }
                
                document.getElementById("ofp_block").innerText = updated_text;
                document.getElementById("res").style.display = "block";
                document.getElementById("dl_btn").style.display = "block";
                
                // ГЕНЕРАЦИЯ СВЕРХСТАБИЛЬНОЙ СТАТИЧЕСКОЙ КАРТЫ
                // Собираем координаты всех точек маршрута в строку
                const pathCoords = data.path.map(pt => `${pt.lon},${pt.lat}`).join(",");
                
                // Используем открытый шлюз статических карт OpenStreetMap (StaticMap API)
                // Он формирует чистую картинку PNG и не требует JS скриптов на клиенте
                const mapUrl = `https://yandex.ru{pathCoords}&pt=${data.path[0].lon},${data.path[0].lat},flag~${data.path[data.path.length-1].lon},${data.path[data.path.length-1].lat},org`;
                
                const mapImg = document.getElementById("static-map");
                const placeholder = document.getElementById("placeholder-text");
                
                mapImg.src = mapUrl;
                placeholder.style.display = "none";
                mapImg.style.display = "block";
                
            } catch (e) {
                console.log(e);
            }
        }

        function downloadPlan() {
            const d = document.getElementById("dep").value.toUpperCase().trim();
            const a = document.getElementById("arr").value.toUpperCase().trim();
            window.location.href = `/download_pln?dep=${d}&arr=${a}`;
        }
    </script>
</body>
</html>
