<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FlyBrief - Flight Planning</title>
    <link rel="stylesheet" href="https://unpkg.com"/>
    <style>
        body { font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; gap: 20px; background: #121212; color: #e0e0e0; }
        #map { flex-grow: 1; height: 850px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #333; }
        .panel { width: 420px; padding: 25px; background: #1a1a1a; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #2d2d2d; }
        h2 { color: #ff9800; border-bottom: 2px solid #ff9800; padding-bottom: 10px; margin-top: 0; font-size: 22px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #b0b0b0; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; font-family: inherit; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        input:focus, select:focus { border-color: #ff9800; outline: none; }
        button { background: #ff9800; color: #000; border: none; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        button:hover { background: #e08600; }
        .btn-download { background: #4caf50; color: #fff; display: none; }
        .btn-download:hover { background: #388e3c; }
        pre { background: #0c0c0c; color: #00ff00; padding: 15px; border-radius: 5px; font-size: 11px; border: 1px solid #222; overflow-x: auto; white-space: pre-wrap; box-shadow: inset 0 0 10px #000; }
        h3 { color: #ff9800; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>FlyBrief Pro v2.0</h2>
        <label>Вылет (ICAO):</label>
        <input id="dep" value="ULLI">
        <label>Прилет (ICAO):</label>
        <input id="arr" value="UUWW">
        <label>Запасной (ICAO):</label>
        <input id="alt" value="UUEE">
        <label>Тип ВС (Самолет):</label>
        <select id="ac">
            <option value="B738">Boeing 737-800</option>
            <option value="A20N">Airbus A320neo</option>
            <option value="B77W">Boeing 777-300ER</option>
            <option value="C172">Cessna 172 Skyhawk</option>
        </select>
        <button onclick="calc()">СГЕНЕРИРОВАТЬ OFP</button>
        <button id="dl_btn" class="btn-download" onclick="downloadPlan()">СКАЧАТЬ ПЛАН (.PLN)</button>
        <div id="res" style="display:none">
            <h3>Operational Flight Plan (OFP):</h3>
            <pre id="ofp_block"></pre>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        const map = L.map("map").setView([55.75, 37.62], 5);
        
        // Стабильная подложка OpenStreetMap, которая никогда не выдает черный экран
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        
        let r1 = null, r2 = null, m = [];

        async function calc() {
            const d = document.getElementById("dep").value.toUpperCase().trim();
            const a = document.getElementById("arr").value.toUpperCase().trim();
            const alt = document.getElementById("alt").value.toUpperCase().trim();
            const c = document.getElementById("ac").value;
            try {
                const res = await fetch(`/calculate?dep=${d}&arr=${a}&alt=${alt}&ac=${c}`);
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById("ofp_block").innerText = data.ofp_text;
                document.getElementById("res").style.display = "block";
                document.getElementById("dl_btn").style.display = "block";
                
                if (r1) map.removeLayer(r1);
                if (r2) map.removeLayer(r2);
                m.forEach(i => map.removeLayer(i));
                m = [];
                
                const polyPoints = data.path.map(pt => {
                    const marker = L.marker([pt.lat, pt.lon]).addTo(map).bindPopup(`<b>${pt.id}</b>`);
                    m.push(marker);
                    return [pt.lat, pt.lon]
                });
                r1 = L.polyline(polyPoints, {color: "#ff9800", weight: 4}).addTo(map);
                const lastPoint = polyPoints[polyPoints.length - 1];
                r2 = L.polyline([lastPoint, [data.alt_lat, data.alt_lon]], {color: "#9c27b0", weight: 3, dashArray: "5,10"}).addTo(map);
                const mAlt = L.marker([data.alt_lat, data.alt_lon]).addTo(map).bindPopup("ALTN: " + data.alt_id);
                m.push(mAlt);
                const group = new L.featureGroup([r1, r2]);
                map.fitBounds(group.getBounds(), {padding: 50});
            } catch (e) {
                console.log(e)
            }
        }

        function downloadPlan() {
            const d = document.getElementById("dep").value.toUpperCase().trim();
            const a = document.getElementById("arr").value.toUpperCase().trim();
            window.location.href = `/download_pln?dep=${d}&arr=${a}`;
        }
    </script>
</body>
</html>
