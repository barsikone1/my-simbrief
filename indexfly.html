<!DOCTYPE html><html><head><meta charset="utf-8"><title>SimBrief Map Pro</title><link rel="stylesheet" href="https://unpkg.com"/><style>body{font-family:monospace;margin:20px;display:flex;gap:20px;background:#f5f5f5}#map{flex-grow:1;height:750px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.panel{width:400px;padding:20px;background:#fff;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.2)}input,select,button{width:100%;padding:10px;margin-bottom:15px;box-sizing:border-box}button{background:#222;color:#fff;border:none;cursor:pointer;font-weight:bold}pre{background:#1e1e1e;color:#d4d4d4;padding:15px;border-radius:5px;font-size:11px;white-space:pre-wrap}</style></head><body><div class="panel"><h2>SimBrief Map EDMS</h2><label>Вылет:</label><input id="dep" value="ULLI"><label>Прилет:</label><input id="arr" value="UUWW"><label>Запасной:</label><input id="alt" value="UUEE"><label>Самолет:</label><select id="ac"><option value="B738">B737-800</option></select><button onclick="calc()">ПОСТРОИТЬ АВИАТРАССУ</button><div id="res" style="display:none"><pre id="ofp_block"></pre></div></div><div id="map"></div><script src="https://unpkg.com"></script><script>const map=L.map("map").setView([55.75,37.62],5);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);let r1=null,r2=null,m=[];async function calc(){const d=document.getElementById("dep").value.toUpperCase().trim(),a=document.getElementById("arr").value.toUpperCase().trim(),alt=document.getElementById("alt").value.toUpperCase().trim(),c=document.getElementById("ac").value;try{const res=await fetch(`/calculate?dep=${d}&arr=${a}&alt=${alt}&ac=${c}`);if(!res.ok)return;const data=await res.json();document.getElementById("ofp_block").innerText=data.ofp_text;document.getElementById("res").style.display="block";if(r1)map.removeLayer(r1);if(r2)map.removeLayer(r2);m.forEach(i=>map.removeLayer(i));m=[];const polyPoints=data.path.map(pt=>{const marker=L.marker([pt.lat,pt.lon]).addTo(map).bindPopup(`<b>${pt.id}</b>`);m.push(marker);return [pt.lat,pt.lon]});r1=L.polyline(polyPoints,{color:"black",weight:4}).addTo(map);const lastPoint=polyPoints[polyPoints.length-1];r2=L.polyline([lastPoint,[data.alt_lat,data.alt_lon]],{color:"purple",weight:3,dashArray:"5,10"}).addTo(map);const mAlt=L.marker([data.alt_lat,data.alt_lon]).addTo(map).bindPopup("ALTN: "+data.alt_id);m.push(mAlt);const group=new L.featureGroup([r1,r2]);map.fitBounds(group.getBounds(),{padding:[30,30]})}catch(e){console.log(e)}}</script></body></html>
