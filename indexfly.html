<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyBrief — Flight Planning</title>

<!-- OpenLayers 9.2.4 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

<style>
  :root{
    --bg:#0b0f14;
    --panel:#111820;
    --panel-2:#0e141b;
    --border:#1e2a36;
    --text:#c9d6e3;
    --muted:#6b7c8f;
    --accent:#ff8a3d;
    --accent-2:#22d3ee;
    --ok:#39d98a;
    --warn:#ffd166;
    --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif}
  #app{display:grid;grid-template-rows:auto 1fr;height:100%}

  header{
    display:flex;align-items:center;gap:12px;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border)
  }
  header h1{font-size:14px;margin:0;letter-spacing:.5px;color:#fff;font-weight:600}
  header .ver{color:var(--muted);font-size:11px}
  header .spacer{flex:1}
  header .status{font-size:11px;color:var(--muted)}
  header .status b{color:var(--ok)}

  .tabs{display:flex;gap:2px;padding:0 14px;background:var(--panel);
    border-bottom:1px solid var(--border)}
  .tab{padding:8px 14px;cursor:pointer;color:var(--muted);
    border-bottom:2px solid transparent;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .tab.active{color:#fff;border-bottom-color:var(--accent)}

  main{display:grid;grid-template-columns:360px 1fr;height:100%;overflow:hidden}
  main.hide-side{grid-template-columns:0 1fr}

  aside{
    border-right:1px solid var(--border);background:var(--panel-2);
    overflow-y:auto;padding:12px;
  }
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .field input,.field select{
    width:100%;padding:6px 8px;background:#0a0f15;color:var(--text);
    border:1px solid var(--border);border-radius:4px;font-size:13px;
    font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .btn{
    display:block;width:100%;padding:9px;background:var(--accent);color:#111;
    border:none;border-radius:4px;font-weight:600;cursor:pointer;
    text-transform:uppercase;letter-spacing:.6px;font-size:12px
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--accent);color:#fff}

  .hint{font-size:11px;color:var(--muted);margin-top:6px}

  #map{position:relative;width:100%;height:100%;background:#05080c}

  #right{
    position:relative;display:none;grid-template-rows:auto 1fr;
    height:100%;overflow:hidden;background:#05080c
  }
  #right.show{display:grid}
  #right-header{
    display:flex;gap:10px;align-items:center;padding:8px 12px;
    background:var(--panel);border-bottom:1px solid var(--border);font-size:12px
  }
  #right-header .spacer{flex:1}
  #right-header button{
    background:transparent;border:1px solid var(--border);color:var(--text);
    padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px
  }
  #right-header button:hover{border-color:var(--accent);color:#fff}

  #ofp{
    margin:0;padding:14px;overflow:auto;
    background:#05080c;color:var(--ok);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:12px;line-height:1.35;white-space:pre;height:100%
  }

  #charts-view,#weather-view{
    display:none;padding:20px;overflow:auto;height:100%;background:#05080c
  }
  #charts-view.show,#weather-view.show{display:block}

  .chart-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .chart-card{
    padding:12px;background:var(--panel);border:1px solid var(--border);
    border-radius:6px
  }
  .chart-card a{color:var(--accent-2);text-decoration:none}
  .chart-card a:hover{text-decoration:underline}

  .metar-box{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:14px;margin-bottom:12px
  }
  .metar-box .icao{color:var(--accent);font-weight:600;margin-bottom:6px}
  .metar-box .raw{
    font-family:ui-monospace,monospace;font-size:12px;color:var(--ok);
    word-break:break-all;white-space:pre-wrap
  }

  #toast{
    position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:6px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;
    max-width:400px
  }
  #toast.show{opacity:1}
  #toast.err{border-color:var(--err);color:var(--err)}
  #toast.ok{border-color:var(--ok);color:var(--ok)}

  @media (max-width: 820px){
    main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{max-height:50vh;border-right:none;border-bottom:1px solid var(--border)}
  }
</style>
</head>

<body>
<div id="app">

  <header>
    <h1>FLYBRIEF</h1>
    <span class="ver">v0.7.1</span>
    <div class="spacer"></div>
    <div class="status" id="status">loading…</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="plan">Flight Plan</div>
    <div class="tab" data-tab="charts">Charts</div>
    <div class="tab" data-tab="weather">Weather</div>
  </div>

  <main id="main">
    <aside>
      <!-- === План полёта === -->
      <div id="form-plan">
        <div class="field">
          <label for="dep">Departure (ICAO)</label>
          <input id="dep" list="dep-list" placeholder="UUEE" value="UUEE" autocomplete="off">
          <datalist id="dep-list"></datalist>
        </div>
        <div class="field">
          <label for="dep_rwy">DEP RWY</label>
          <select id="dep_rwy"><option value="">— выбери полосу —</option></select>
        </div>

        <div class="field">
          <label for="arr">Arrival (ICAO)</label>
          <input id="arr" list="arr-list" placeholder="ULLI" value="ULLI" autocomplete="off">
          <datalist id="arr-list"></datalist>
        </div>
        <div class="field">
          <label for="arr_rwy">ARR RWY</label>
          <select id="arr_rwy"><option value="">— выбери полосу —</option></select>
        </div>

        <div class="field">
          <label for="ac">Aircraft</label>
          <select id="ac">
            <option>A320</option><option>A319</option><option>A321</option>
            <option>A330</option><option>A350</option>
            <option>B737</option><option>B738</option><option>B739</option>
            <option>B747</option><option>B777</option><option>B787</option>
            <option>E190</option><option>CRJ9</option><option>AT72</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="pax">PAX</label>
            <input id="pax" type="number" min="0" max="500" value="150">
          </div>
          <div class="field">
            <label for="cargo">Cargo (kg)</label>
            <input id="cargo" type="number" min="0" value="0">
          </div>
        </div>

        <button class="btn" id="btn-calc">Generate OFP</button>
        <button class="btn ghost" id="btn-download" style="margin-top:8px">Download .pln</button>

        <div class="hint" id="hint">
          Тип полосы подгружается автоматически при вводе ICAO.
        </div>
      </div>

      <!-- === Charts === -->
      <div id="form-charts" style="display:none">
        <div class="field">
          <label for="charts-icao">Airport ICAO</label>
          <input id="charts-icao" placeholder="UUEE" value="UUEE">
        </div>
        <button class="btn" id="btn-charts">Load charts</button>
      </div>

      <!-- === Weather === -->
      <div id="form-weather" style="display:none">
        <div class="field">
          <label for="weather-icao">Airport ICAO</label>
          <input id="weather-icao" placeholder="UUEE" value="UUEE">
        </div>
        <button class="btn" id="btn-weather">Load METAR</button>
      </div>
    </aside>

    <div id="map"></div>

    <div id="right">
      <div id="right-header">
        <span id="right-title">OFP</span>
        <div class="spacer"></div>
        <button id="btn-close-right">×</button>
      </div>
      <pre id="ofp"></pre>
    </div>

    <div id="charts-view"></div>
    <div id="weather-view"></div>
  </main>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   ГЛОБАЛЬНЫЕ
   ============================================================ */
const state = {
  map: null,
  routeLayer: null,
  wptLayer: null,
  aptLayer: null,
  altLayer: null,
  lastRoute: null,
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + (kind || "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ""; }, 3500);
}
function $(id){ return document.getElementById(id); }

async function api(path, opts){
  const r = await fetch(path, opts);
  if (!r.ok){
    let txt = await r.text();
    throw new Error(`${r.status} ${txt.slice(0,200)}`);
  }
  return r.json();
}

/* ============================================================
   КАРТА
   ============================================================ */
function initMap(){
  state.routeLayer = new ol.layer.Vector({
    source: new ol.source.Vector(),
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "#ff8a3d", width: 2.5 }),
    }),
    zIndex: 30,
  });
  state.altLayer = new ol.layer.Vector({
    source: new ol.source.Vector(),
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({
        color: "#a855f7", width: 2, lineDash: [6,6]
      }),
    }),
    zIndex: 25,
  });
  state.wptLayer = new ol.layer.Vector({
    source: new ol.source.Vector(),
    style: new ol.style.Style({
      image: new ol.style.Circle({
        radius: 4,
        fill: new ol.style.Fill({ color: "#22d3ee" }),
        stroke: new ol.style.Stroke({ color: "#0a0f15", width: 1 }),
      }),
      text: new ol.style.Text({
        text: "",
        font: "11px monospace",
        fill: new ol.style.Fill({ color: "#22d3ee" }),
        stroke: new ol.style.Stroke({ color: "#05080c", width: 3 }),
        offsetY: -12,
      }),
    }),
    zIndex: 35,
  });
  state.aptLayer = new ol.layer.Vector({
    source: new ol.source.Vector(),
    style: new ol.style.Style({
      image: new ol.style.Circle({
        radius: 6,
        fill: new ol.style.Fill({ color: "#ff8a3d" }),
        stroke: new ol.style.Stroke({ color: "#05080c", width: 1.5 }),
      }),
      text: new ol.style.Text({
        text: "",
        font: "bold 12px monospace",
        fill: new ol.style.Fill({ color: "#ff8a3d" }),
        stroke: new ol.style.Stroke({ color: "#05080c", width: 3 }),
        offsetY: 18,
      }),
    }),
    zIndex: 40,
  });

  state.map = new ol.Map({
    target: "map",
    layers: [
      new ol.layer.Tile({
        source: new ol.source.XYZ({
          url: "https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          attributions: "© OpenStreetMap, © CARTO",
          maxZoom: 19,
        }),
      }),
      state.altLayer,
      state.routeLayer,
      state.wptLayer,
      state.aptLayer,
    ],
    view: new ol.View({
      center: ol.proj.fromLonLat([30.3, 59.9]),
      zoom: 5,
    }),
  });
}

/* ============================================================
   РИСОВАНИЕ МАРШРУТА
   ============================================================ */
function clearLayers(){
  state.routeLayer.getSource().clear();
  state.wptLayer.getSource().clear();
  state.aptLayer.getSource().clear();
  state.altLayer.getSource().clear();
}

function drawRoute(route){
  clearLayers();

  const pts = route.points || [];
  if (!pts.length) return;

  // линия маршрута
  const coords = pts.map(p => ol.proj.fromLonLat([p.lon, p.lat]));
  const line = new ol.Feature({ geometry: new ol.geom.LineString(coords) });
  state.routeLayer.getSource().addFeature(line);

  // waypoints
  for (const p of pts){
    const f = new ol.Feature({
      geometry: new ol.geom.Point(ol.proj.fromLonLat([p.lon, p.lat]))
    });
    f.set("ident", p.ident);
    f.set("awy", p.awy || "");
    const style = state.wptLayer.getStyle().clone();
    const txt = p.awy ? `${p.ident} [${p.awy}]` : p.ident;
    style.getText().setText(txt);
    f.setStyle(style);
    state.wptLayer.getSource().addFeature(f);
  }

  // аэропорты (первый и последний)
  for (const idx of [0, pts.length - 1]){
    const p = pts[idx];
    const f = new ol.Feature({
      geometry: new ol.geom.Point(ol.proj.fromLonLat([p.lon, p.lat]))
    });
    const style = state.aptLayer.getStyle().clone();
    style.getText().setText(p.ident);
    f.setStyle(style);
    state.aptLayer.getSource().addFeature(f);
  }

  // extent
  const extent = ol.extent.boundingExtent(coords);
  state.map.getView().fit(extent, { padding: [60,60,60,60], duration: 500, maxZoom: 9 });
}

/* ============================================================
   RWY SELECTS
   ============================================================ */
function fillRunwaySelect(selectId, runways){
  const sel = $(selectId);
  sel.innerHTML = "";
  if (!runways || !runways.length){
    sel.innerHTML = "<option value=''>— нет данных —</option>";
    return;
  }
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = "— выбери полосу —";
  sel.appendChild(opt0);

  for (const rw of runways){
    const opt = document.createElement("option");
    opt.value = rw.ident;
    const hdg = (rw.hdg !== undefined && rw.hdg !== null) ? Math.round(rw.hdg) : 0;
    const len_m = rw.len_ft ? Math.round(rw.len_ft * 0.3048) : 0;
    opt.textContent = `${rw.ident}  ${String(hdg).padStart(3,'0')}°  ${len_m}m`;
    sel.appendChild(opt);
  }
}

async function loadRunways(icao, selectId){
  const sel = $(selectId);
  if (!icao || icao.length < 4){
    sel.innerHTML = "<option value=''>— выбери полосу —</option>";
    return;
  }
  sel.innerHTML = "<option value=''>…</option>";
  try{
    const data = await api(`/runways?icao=${encodeURIComponent(icao.toUpperCase())}`);
    fillRunwaySelect(selectId, data.runways || []);
  }catch(e){
    console.error(e);
    sel.innerHTML = "<option value=''>— ошибка —</option>";
  }
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
async function handleCalc(){
  const dep = $("dep").value.trim().toUpperCase();
  const arr = $("arr").value.trim().toUpperCase();
  if (dep.length < 4 || arr.length < 4){
    toast("Введи ICAO аэропортов (4 буквы)", "err");
    return;
  }
  const body = {
    dep: dep,
    arr: arr,
    ac: $("ac").value,
    pax: parseInt($("pax").value || "150", 10),
    cargo: parseFloat($("cargo").value || "0"),
    dep_rwy: $("dep_rwy").value || null,
    arr_rwy: $("arr_rwy").value || null,
  };

  const btn = $("btn-calc");
  btn.disabled = true; btn.textContent = "…";
  $("status").textContent = "calculating…";

  try{
    const route = await api("/calculate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    state.lastRoute = route;
    drawRoute(route);

    // OFP
    $("ofp").textContent = route.ofp_text || "(no ofp_text in response)";
    $("right").classList.add("show");
    $("right-title").textContent = `OFP — ${route.dep} → ${route.arr} (${route.source})`;

    $("status").innerHTML =
      `source=<b>${route.source}</b> · ${Math.round(route.distance_nm)} NM · ` +
      `wps=${(route.points||[]).length}`;
    toast("OFP готов", "ok");
  }catch(e){
    console.error(e);
    toast("Ошибка: " + e.message, "err");
    $("status").textContent = "error";
  }finally{
    btn.disabled = false; btn.textContent = "Generate OFP";
  }
}

async function handleDownload(){
  const dep = $("dep").value.trim().toUpperCase();
  const arr = $("arr").value.trim().toUpperCase();
  if (dep.length < 4 || arr.length < 4){
    toast("Введи ICAO", "err");
    return;
  }
  window.location.href = `/download_pln?dep=${encodeURIComponent(dep)}&arr=${encodeURIComponent(arr)}`;
}

async function handleCharts(){
  const icao = $("charts-icao").value.trim().toUpperCase();
  if (icao.length < 4){ toast("Введи ICAO", "err"); return; }
  try{
    const data = await api(`/charts?icao=${encodeURIComponent(icao)}`);
    const html = (data.charts || []).map(c =>
      `<div class="chart-card"><a href="${c.url}" target="_blank" rel="noopener">${c.name}</a></div>`
    ).join("");
    $("charts-view").innerHTML = `<h3>Charts — ${data.icao}</h3>
      <div class="chart-list">${html || "<p>Нет чартов.</p>"}</div>`;
  }catch(e){
    toast("Ошибка: " + e.message, "err");
  }
}

async function handleWeather(){
  const icao = $("weather-icao").value.trim().toUpperCase();
  if (icao.length < 4){ toast("Введи ICAO", "err"); return; }
  try{
    const data = await api(`/weather?icao=${encodeURIComponent(icao)}`);
    const raw = data.metar || "(нет данных)";
    $("weather-view").innerHTML = `
      <div class="metar-box">
        <div class="icao">${data.icao}</div>
        <div class="raw">${raw.replace(/</g,"&lt;")}</div>
      </div>`;
  }catch(e){
    toast("Ошибка: " + e.message, "err");
  }
}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
function setTab(name){
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === name);
  });
  const isPlan = name === "plan";
  $("form-plan").style.display = isPlan ? "" : "none";
  $("form-charts").style.display = name === "charts" ? "" : "none";
  $("form-weather").style.display = name === "weather" ? "" : "none";

  $("map").style.display = isPlan ? "" : "none";
  $("right").classList.toggle("show", isPlan && !!state.lastRoute);

  $("charts-view").classList.toggle("show", name === "charts");
  $("weather-view").classList.toggle("show", name === "weather");

  if (!isPlan){
    $("main").classList.add("hide-side");
  } else {
    $("main").classList.remove("hide-side");
  }
}

/* ============================================================
   ПОИСК АЭРОПОРТОВ (datalist)
   ============================================================ */
async function loadAirportSuggestions(q, datalistId){
  if (!q || q.length < 2) return;
  try{
    const data = await api(`/airports/search?q=${encodeURIComponent(q)}`);
    const dl = $(datalistId);
    dl.innerHTML = "";
    for (const a of data.slice(0, 20)){
      const opt = document.createElement("option");
      opt.value = a.ident;
      opt.label = `${a.name} ${a.iata ? "("+a.iata+")" : ""}`;
      dl.appendChild(opt);
    }
  }catch(e){ /* тихо */ }
}

/* ============================================================
   СТАТУС
   ============================================================ */
async function refreshStatus(){
  try{
    const s = await api("/airports/stats");
    const ok = s.xplane_loaded ? "X-Plane <b>ON</b>" : "X-Plane <b style='color:#ff5c5c'>off</b>";
    $("status").innerHTML =
      `airports ${s.airports} · fixes ${s.fixes} · airways ${s.airways} · ${ok}`;
  }catch(e){
    $("status").textContent = "backend offline";
  }
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener("DOMContentLoaded", () => {
  initMap();
  refreshStatus();
  setInterval(refreshStatus, 30000);

  // вкладки
  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => setTab(t.dataset.tab));
  });

  // кнопки
  $("btn-calc").addEventListener("click", handleCalc);
  $("btn-download").addEventListener("click", handleDownload);
  $("btn-charts").addEventListener("click", handleCharts);
  $("btn-weather").addEventListener("click", handleWeather);
  $("btn-close-right").addEventListener("click", () => {
    $("right").classList.remove("show");
  });

  // DEP / ARR
  let depTimer, arrTimer;
  $("dep").addEventListener("input", e => {
    const v = e.target.value.toUpperCase();
    e.target.value = v;
    clearTimeout(depTimer);
    depTimer = setTimeout(() => {
      loadRunways(v, "dep_rwy");
      loadAirportSuggestions(v, "dep-list");
    }, 400);
  });
  $("arr").addEventListener("input", e => {
    const v = e.target.value.toUpperCase();
    e.target.value = v;
    clearTimeout(arrTimer);
    arrTimer = setTimeout(() => {
      loadRunways(v, "arr_rwy");
      loadAirportSuggestions(v, "arr-list");
    }, 400);
  });

  // ENTER = посчитать
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.target.id === "dep" || e.target.id === "arr")){
      handleCalc();
    }
  });

  // первичная загрузка полос для дефолтных UUEE/ULLI
  loadRunways("UUEE", "dep_rwy");
  loadRunways("ULLI", "arr_rwy");
});
</script>
</body>
</html>
