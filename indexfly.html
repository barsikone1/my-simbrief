<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyBrief — Flight Planning</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
<script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>

<style>
  :root {
    --bg-0: #16171a; --bg-1: #1a1a1a; --bg-2: #202226; --bg-3: #26282d;
    --border: #2e3138; --text: #d8dadd; --text-dim: #8a8f97;
    --accent: #ff9800; --accent-dim: #b56d00;
    --green: #4caf50; --term: #39ff14; --purple: #b266ff; --cyan: #00e5ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-0); color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px; overflow: hidden;
  }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; width: 100vw; }

  #sidebar { background: var(--bg-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }

  #brand { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #1d1f23 0%, #16171a 100%); }
  #brand .logo { width: 26px; height: 26px; border-radius: 4px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #16171a; font-weight: 800; font-size: 14px; }
  #brand .title { font-weight: 700; letter-spacing: 0.5px; font-size: 15px; }
  #brand .title span { color: var(--accent); }
  #brand .sub { color: var(--text-dim); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-left: auto; }

  .panel { border-bottom: 1px solid var(--border); padding: 12px 14px 14px; }
  .panel h3 { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .panel h3::before { content: ""; width: 4px; height: 12px; background: var(--accent); border-radius: 1px; }

  .field { display: flex; flex-direction: column; margin-bottom: 8px; }
  .field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); margin-bottom: 4px; }
  .field input, .field select {
    background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 9px; border-radius: 3px; font-size: 13px; outline: none;
    transition: border-color .15s, background .15s; font-family: inherit;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); background: var(--bg-3); }
  .field input::placeholder { color: #555a62; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn {
    background: var(--accent); color: #16171a; border: none; padding: 9px 12px;
    border-radius: 3px; font-weight: 700; font-size: 12px; letter-spacing: 0.6px;
    text-transform: uppercase; cursor: pointer; transition: background .15s, transform .05s;
    width: 100%; margin-top: 4px; font-family: inherit;
  }
  .btn:hover { background: #ffb13d; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { background: var(--bg-3); color: var(--text-dim); cursor: not-allowed; }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); }
  .btn.secondary:hover { background: rgba(255,152,0,0.08); }

  #ofp {
    background: #0d0f10; border-top: 1px solid var(--border); flex: 1;
    padding: 10px 12px; font-family: "Courier New", monospace; font-size: 11.5px;
    color: var(--term); overflow-y: auto; white-space: pre-wrap;
    min-height: 200px; text-shadow: 0 0 4px rgba(57,255,20,0.25);
  }
  #ofp .err { color: #ff5555; text-shadow: 0 0 4px rgba(255,85,85,0.4); }

  #map-wrap { position: relative; height: 100vh; width: 100%; background: #0a0b0d; }
  #map { width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 12px; left: 12px;
    background: rgba(22,23,26,0.85); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 3px; font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.5px; backdrop-filter: blur(4px);
    pointer-events: none;
  }
  #hud b { color: var(--accent); }
  #hud .src-manual { color: var(--green); }
  #hud .src-fpdb { color: var(--green); }
  #hud .src-gc { color: #ffcc66; }

  #legend {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(22,23,26,0.9); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 3px; font-size: 11px;
    color: var(--text-dim); line-height: 1.7; backdrop-filter: blur(4px);
  }
  #legend .sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }

  #charts-bar {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(22,23,26,0.92); border: 1px solid var(--border);
    border-radius: 3px; padding: 8px 10px; font-size: 11px;
    backdrop-filter: blur(4px); max-width: 320px;
  }
  #charts-bar h4 { margin: 0 0 6px 0; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  #charts-bar .grp { margin-bottom: 6px; }
  #charts-bar .grp:last-child { margin-bottom: 0; }
  #charts-bar .grp b { color: var(--text); font-size: 11px; }
  #charts-bar a { color: var(--cyan); text-decoration: none; margin-right: 8px; font-size: 10.5px; }
  #charts-bar a:hover { text-decoration: underline; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-1); }
  ::-webkit-scrollbar-thumb { background: #33363c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #44474e; }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <div class="logo">F</div>
      <div class="title">Fly<span>Brief</span></div>
      <div class="sub" id="aptCount">OFP v0.3</div>
    </div>

    <div class="panel">
      <h3>Flight Info</h3>
      <div class="row">
        <div class="field">
          <label for="dep">Departure</label>
          <input id="dep" type="text" placeholder="EDDF" maxlength="5" value="EDDF" />
        </div>
        <div class="field">
          <label for="arr">Arrival</label>
          <input id="arr" type="text" placeholder="EDDM" maxlength="5" value="EDDM" />
        </div>
      </div>
      <div class="field">
        <label for="ac">Aircraft Type</label>
        <select id="ac">
          <option value="B738">B738 — Boeing 737-800</option>
          <option value="A20N">A20N — Airbus A320neo</option>
          <option value="A21N">A21N — Airbus A321neo</option>
          <option value="A333">A333 — Airbus A330-300</option>
          <option value="A359">A359 — Airbus A350-900</option>
          <option value="B77W">B77W — Boeing 777-300ER</option>
          <option value="B788">B788 — Boeing 787-8</option>
          <option value="B789">B789 — Boeing 787-9</option>
          <option value="B744">B744 — Boeing 747-400</option>
          <option value="B748">B748 — Boeing 747-8</option>
          <option value="E190">E190 — Embraer E190</option>
          <option value="AT76">AT76 — ATR 72-600</option>
          <option value="DH8D">DH8D — Bombardier Q400</option>
          <option value="C25A">C25A — Cessna Citation CJ2</option>
          <option value="C172">C172 — Cessna 172 Skyhawk</option>
        </select>
      </div>
    </div>

    <div class="panel">
      <h3>Aircraft Options</h3>
      <div class="row">
        <div class="field">
          <label for="pax">Pax</label>
          <input id="pax" type="number" min="0" max="550" value="160" />
        </div>
        <div class="field">
          <label for="cargo">Cargo (kg)</label>
          <input id="cargo" type="number" min="0" max="50000" value="2000" />
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Actions</h3>
      <button class="btn" id="calcBtn" onclick="calc()">Generate OFP</button>
      <button class="btn secondary" id="dlBtn" onclick="downloadPln()" disabled>Download .PLN</button>
    </div>

    <div id="ofp">// Awaiting flight plan generation...</div>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="hud">FlyBrief · <b>OpenLayers</b> · <span id="routeSource">Route: —</span></div>
    <div id="legend">
      <div><span class="sw" style="background:#ff9800"></span>Route / Airports</div>
      <div><span class="sw" style="background:#00e5ff"></span>Waypoints</div>
      <div><span class="sw" style="background:#b266ff"></span>Alternate (dashed)</div>
    </div>
    <div id="charts-bar" style="display:none;">
      <h4>Charts</h4>
      <div id="charts-content"></div>
    </div>
  </main>
</div>

<script>
const API_BASE = "";
const $ = (id) => document.getElementById(id);

function setOFP(html, isError) {
  const el = $("ofp");
  el.innerHTML = isError ? `<span class="err">${html}</span>` : html;
}

/* ========= OpenLayers ========= */
const routeSource = new ol.source.Vector();
const wptSource   = new ol.source.Vector();
const aptSource   = new ol.source.Vector();
const altSource   = new ol.source.Vector();

const routeLayer = new ol.layer.Vector({
  source: routeSource,
  style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: "#ff9800", width: 2.4 }) })
});

const wptLayer = new ol.layer.Vector({
  source: wptSource,
  style: (feature) => {
    const id = feature.get("id") || "";
    return new ol.style.Style({
      image: new ol.style.RegularShape({
        points: 3, radius: 6,
        fill: new ol.style.Fill({ color: "#00e5ff" }),
        stroke: new ol.style.Stroke({ color: "#0a0b0d", width: 1 })
      }),
      text: new ol.style.Text({
        text: id, offsetY: -14,
        font: "700 10px 'Courier New', monospace",
        fill: new ol.style.Fill({ color: "#00e5ff" }),
        stroke: new ol.style.Stroke({ color: "#0a0b0d", width: 3 })
      })
    });
  }
});

const aptLayer = new ol.layer.Vector({
  source: aptSource,
  style: (feature) => {
    const id = feature.get("id") || "";
    return new ol.style.Style({
      image: new ol.style.RegularShape({
        points: 4, radius: 7, angle: Math.PI / 4,
        fill: new ol.style.Fill({ color: "#ff9800" }),
        stroke: new ol.style.Stroke({ color: "#16171a", width: 1.5 })
      }),
      text: new ol.style.Text({
        text: id, offsetY: -16,
        font: "700 11px 'Segoe UI', sans-serif",
        fill: new ol.style.Fill({ color: "#ff9800" }),
        stroke: new ol.style.Stroke({ color: "#0a0b0d", width: 3 })
      })
    });
  }
});

const altLayer = new ol.layer.Vector({
  source: altSource,
  style: new ol.style.Style({
    stroke: new ol.style.Stroke({ color: "#b266ff", width: 2, lineDash: [8, 6] })
  })
});

const baseLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({
    url: "https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    attributions: "© OpenStreetMap contributors © CARTO",
    maxZoom: 19
  })
});

const map = new ol.Map({
  target: "map",
  layers: [baseLayer, altLayer, routeLayer, wptLayer, aptLayer],
  view: new ol.View({ center: ol.proj.fromLonLat([10.0, 50.0]), zoom: 5, minZoom: 2, maxZoom: 16 })
});

/* ========= helpers ========= */
function clearLayers() {
  routeSource.clear(); wptSource.clear(); aptSource.clear(); altSource.clear();
}

function addAirport(lon, lat, ident) {
  if (typeof lon !== "number" || typeof lat !== "number") return;
  aptSource.addFeature(new ol.Feature({
    geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
    id: ident || ""
  }));
}

function addWaypoint(lon, lat, ident) {
  if (typeof lon !== "number" || typeof lat !== "number") return;
  wptSource.addFeature(new ol.Feature({
    geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
    id: ident || ""
  }));
}

function addRouteLine(coords) {
  if (!coords || coords.length < 2) return;
  const pts = coords.map(c => ol.proj.fromLonLat([c[0], c[1]]));
  routeSource.addFeature(new ol.Feature({ geometry: new ol.geom.LineString(pts) }));
}

function addAlternateLine(from, to) {
  if (!from || !to) return;
  const pts = [from, to].map(c => ol.proj.fromLonLat([c[0], c[1]]));
  altSource.addFeature(new ol.Feature({ geometry: new ol.geom.LineString(pts) }));
}

function fitToAll() {
  let extent = null;
  [routeSource, wptSource, aptSource, altSource].forEach(src => {
    const e = src.getExtent();
    if (e && e.length === 4 && isFinite(e[0])) {
      if (!extent) extent = e.slice();
      else {
        extent[0] = Math.min(extent[0], e[0]);
        extent[1] = Math.min(extent[1], e[1]);
        extent[2] = Math.max(extent[2], e[2]);
        extent[3] = Math.max(extent[3], e[3]);
      }
    }
  });
  if (extent) map.getView().fit(extent, { padding: [60, 60, 60, 60], duration: 700, maxZoom: 10 });
}

/* ========= OFP ========= */
function renderOFP(data) {
  if (data.ofp_text) {
    setOFP(data.ofp_text, false);
    return;
  }
  const lines = [];
  lines.push("================================================");
  lines.push("  FLYBRIEF OFP");
  lines.push("================================================");
  lines.push("  Route source: " + (data.route_source || "?"));
  lines.push("  Distance: " + (data.distance_nm || "?") + " NM");
  lines.push("  ETE: " + (data.ete || "?"));
  lines.push("  Fuel: " + (data.fuel_kg || "?") + " KG");
  lines.push("  Alternate: " + (data.alternate || "?"));
  lines.push("================================================");
  setOFP(lines.join("\n"), false);
}

/* ========= charts ========= */
function renderCharts(charts) {
  const bar = $("charts-bar");
  const content = $("charts-content");
  if (!charts) { bar.style.display = "none"; return; }

  const order = [["dep", "DEP"], ["arr", "ARR"], ["alt", "ALTN"]];
  let html = "";
  order.forEach(([key, label]) => {
    const c = charts[key];
    if (!c) return;
    html += `<div class="grp"><b>${label} ${c.icao}</b><br>`;
    (c.links || []).slice(0, 4).forEach(l => {
      html += `<a href="${l.url}" target="_blank" rel="noopener">${l.name}</a>`;
    });
    html += `</div>`;
  });
  content.innerHTML = html;
  bar.style.display = "block";
}

/* ========= main ========= */
async function calc() {
  const dep = ($("dep").value || "").trim().toUpperCase();
  const arr = ($("arr").value || "").trim().toUpperCase();
  const ac  = $("ac").value;

  if (!dep || !arr) { setOFP("// ERROR: dep and arr required.", true); return; }
  if (dep.length < 3 || arr.length < 3) { setOFP("// ERROR: ICAO must be >=3 chars.", true); return; }

  $("calcBtn").disabled = true;
  $("dlBtn").disabled = true;
  setOFP("// Generating flight plan...\n// Querying backend...", false);

  const url = `${API_BASE}/calculate?dep=${encodeURIComponent(dep)}&arr=${encodeURIComponent(arr)}&ac=${encodeURIComponent(ac)}`;

  try {
    const res = await fetch(url, { method: "GET" });
    const raw = await res.text();
    let data = null;
    try { data = JSON.parse(raw); } catch (_) { data = null; }

    if (!res.ok) {
      const detail = (data && (data.detail || data.message || data.error)) || raw.slice(0, 400) || res.statusText;
      throw new Error(`HTTP ${res.status} — ${typeof detail === "string" ? detail : JSON.stringify(detail)}`);
    }
    if (!data || typeof data !== "object") {
      throw new Error("Backend returned non-JSON: " + raw.slice(0, 200));
    }

    renderOFP(data);

    // route source badge
    const srcEl = $("routeSource");
    srcEl.className = "src-" + (data.route_source || "gc");
    srcEl.textContent = "Route: " + (data.route_source || "?").toUpperCase();
    if (data.airports_count) $("aptCount").textContent = "OFP v0.3 · " + data.airports_count + " apts";

    // charts
    renderCharts(data.charts);

    // map
    clearLayers();

    if (Array.isArray(data.path) && data.path.length >= 2) {
      addRouteLine(data.path);
      addAirport(data.path[0][0], data.path[0][1], dep);
      addAirport(data.path[data.path.length - 1][0], data.path[data.path.length - 1][1], arr);
    }

    if (Array.isArray(data.waypoints)) {
      data.waypoints.forEach(w => {
        if (typeof w.lon === "number" && typeof w.lat === "number") {
          // Не дублируем аэропорты как waypoints
          if (w.id !== dep && w.id !== arr && w.id !== data.alt_id) {
            addWaypoint(w.lon, w.lat, w.id);
          }
        }
      });
    }

    if (typeof data.alt_lat === "number" && typeof data.alt_lon === "number") {
      const last = data.path && data.path[data.path.length - 1];
      if (last) addAlternateLine(last, [data.alt_lon, data.alt_lat]);
      addAirport(data.alt_lon, data.alt_lat, data.alt_id || "ALTN");
    }

    fitToAll();
    $("dlBtn").disabled = false;

  } catch (err) {
    console.error(err);
    setOFP("// ERROR: Failed to generate flight plan.\n// " + (err && err.message ? err.message : String(err)), true);
  } finally {
    $("calcBtn").disabled = false;
  }
}

function downloadPln() {
  const dep = ($("dep").value || "").trim().toUpperCase();
  const arr = ($("arr").value || "").trim().toUpperCase();
  if (!dep || !arr) { setOFP("// ERROR: dep and arr required.", true); return; }
  const url = `${API_BASE}/download_pln?dep=${encodeURIComponent(dep)}&arr=${encodeURIComponent(arr)}`;
  const a = document.createElement("a");
  a.href = url;
  a.download = `${dep}-${arr}.pln`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

window.addEventListener("load", () => { setTimeout(() => calc(), 300); });

["dep", "arr", "pax", "cargo"].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); calc(); }
  });
});
</script>

</body>
</html>
