<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyBrief — Flight Planning</title>

<!-- OpenLayers CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
<!-- OpenLayers JS -->
<script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>

<style>
  :root {
    --bg-0: #16171a;
    --bg-1: #1a1a1a;
    --bg-2: #202226;
    --bg-3: #26282d;
    --border: #2e3138;
    --text: #d8dadd;
    --text-dim: #8a8f97;
    --accent: #ff9800;
    --accent-dim: #b56d00;
    --green: #4caf50;
    --term: #39ff14;
    --purple: #b266ff;
    --cyan: #00e5ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 360px 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    background: var(--bg-1);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  #brand {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(180deg, #1d1f23 0%, #16171a 100%);
  }
  #brand .logo {
    width: 26px; height: 26px;
    border-radius: 4px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #16171a; font-weight: 800; font-size: 14px;
  }
  #brand .title {
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 15px;
  }
  #brand .title span { color: var(--accent); }
  #brand .sub {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-left: auto;
  }

  .panel {
    border-bottom: 1px solid var(--border);
    padding: 12px 14px 14px;
  }
  .panel h3 {
    margin: 0 0 10px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel h3::before {
    content: "";
    width: 4px; height: 12px;
    background: var(--accent);
    border-radius: 1px;
  }

  .field {
    display: flex;
    flex-direction: column;
    margin-bottom: 8px;
  }
  .field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .field input, .field select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 9px;
    border-radius: 3px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s, background .15s;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    background: var(--bg-3);
  }
  .field input::placeholder { color: #555a62; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    background: var(--accent);
    color: #16171a;
    border: none;
    padding: 9px 12px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s, transform .05s;
    width: 100%;
    margin-top: 4px;
    font-family: inherit;
  }
  .btn:hover { background: #ffb13d; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled {
    background: var(--bg-3);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .btn.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
  }
  .btn.secondary:hover {
    background: rgba(255,152,0,0.08);
  }

  /* ---------- OFP ---------- */
  #ofp {
    background: #0d0f10;
    border-top: 1px solid var(--border);
    flex: 1;
    padding: 10px 12px;
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: var(--term);
    overflow-y: auto;
    white-space: pre-wrap;
    min-height: 180px;
    text-shadow: 0 0 4px rgba(57,255,20,0.25);
  }
  #ofp .dim { color: #1f7a1f; }
  #ofp .err { color: #ff5555; text-shadow: 0 0 4px rgba(255,85,85,0.4); }

  /* ---------- Map ---------- */
  #map-wrap {
    position: relative;
    height: 100vh;
    width: 100%;
    background: #0a0b0d;
  }
  #map { width: 100%; height: 100%; }

  /* Map overlay HUD */
  #hud {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(22,23,26,0.85);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }
  #hud b { color: var(--accent); }

  #legend {
    position: absolute;
    bottom: 12px; right: 12px;
    background: rgba(22,23,26,0.9);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.7;
    backdrop-filter: blur(4px);
  }
  #legend .sw {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 6px;
    vertical-align: middle;
    border-radius: 2px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-1); }
  ::-webkit-scrollbar-thumb { background: #33363c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #44474e; }

  /* Airport / waypoint labels on map */
  .ol-airport-label {
    background: rgba(22,23,26,0.85);
    color: var(--accent);
    font-family: "Segoe UI", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 1px 5px;
    border-radius: 2px;
    border: 1px solid var(--accent-dim);
    white-space: nowrap;
  }
  .ol-wp-label {
    background: rgba(22,23,26,0.75);
    color: var(--cyan);
    font-family: "Courier New", monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 0px 4px;
    border-radius: 2px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="app">
  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar">
    <div id="brand">
      <div class="logo">F</div>
      <div class="title">Fly<span>Brief</span></div>
      <div class="sub">OFP v1.0</div>
    </div>

    <!-- Flight Info -->
    <div class="panel">
      <h3>Flight Info</h3>
      <div class="row">
        <div class="field">
          <label for="dep">Departure</label>
          <input id="dep" type="text" placeholder="EDDF" maxlength="4" value="EDDF" />
        </div>
        <div class="field">
          <label for="arr">Arrival</label>
          <input id="arr" type="text" placeholder="EDDM" maxlength="4" value="EDDM" />
        </div>
      </div>
      <div class="field">
        <label for="ac">Aircraft Type</label>
        <select id="ac">
          <option value="B738">B738 — Boeing 737-800</option>
          <option value="A20N">A20N — Airbus A320neo</option>
          <option value="B77W">B77W — Boeing 777-300ER</option>
          <option value="C172">C172 — Cessna 172</option>
        </select>
      </div>
    </div>

    <!-- Aircraft Options -->
    <div class="panel">
      <h3>Aircraft Options</h3>
      <div class="row">
        <div class="field">
          <label for="pax">Pax</label>
          <input id="pax" type="number" min="0" max="550" value="160" />
        </div>
        <div class="field">
          <label for="cargo">Cargo (kg)</label>
          <input id="cargo" type="number" min="0" max="50000" value="2000" />
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="panel">
      <h3>Actions</h3>
      <button class="btn" id="calcBtn" onclick="calc()">Generate OFP</button>
      <button class="btn secondary" id="dlBtn" onclick="downloadPln()" disabled>Download .PLN</button>
    </div>

    <!-- OFP terminal -->
    <div id="ofp" class="dim">// Awaiting flight plan generation...</div>
  </aside>

  <!-- ============ MAP ============ -->
  <main id="map-wrap">
    <div id="map"></div>
    <div id="hud">FlyBrief · <b>OpenLayers</b> · Route Preview</div>
    <div id="legend">
      <div><span class="sw" style="background:#ff9800"></span>Route / Airports</div>
      <div><span class="sw" style="background:#00e5ff"></span>Waypoints</div>
      <div><span class="sw" style="background:#b266ff"></span>Alternate (dashed)</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   FlyBrief — Frontend (OpenLayers)
   Backend: FastAPI on Render (same origin or configured base)
   ============================================================ */

// -------- Backend base URL --------
// Если фронт и бэк на одном домене — оставь пустую строку.
// Иначе укажи, например: "https://my-simbrief.onrender.com"
const API_BASE = "";

// -------- Utility --------
const $ = (id) => document.getElementById(id);

function setOFP(html, isError) {
  const el = $("ofp");
  el.innerHTML = isError
    ? `<span class="err">${html}</span>`
    : html;
}

/* ============================================================
   OpenLayers map
   ============================================================ */

const routeSource  = new ol.source.Vector();
const wptSource    = new ol.source.Vector();
const aptSource    = new ol.source.Vector();
const altSource    = new ol.source.Vector();

const routeLayer = new ol.layer.Vector({
  source: routeSource,
  style: new ol.style.Style({
    stroke: new ol.style.Stroke({ color: "#ff9800", width: 2.4 })
  })
});

// Waypoints: turquoise triangles with ID labels
const wptLayer = new ol.layer.Vector({
  source: wptSource,
  style: (feature) => {
    const id = feature.get("id") || "";
    return new ol.style.Style({
      image: new ol.style.RegularShape({
        points: 3,
        radius: 6,
        rotation: 0,
        fill: new ol.style.Fill({ color: "#00e5ff" }),
        stroke: new ol.style.Stroke({ color: "#0a0b0d", width: 1 })
      }),
      text: new ol.style.Text({
        text: id,
        offsetY: -14,
        font: "700 10px 'Courier New', monospace",
        fill: new ol.style.Fill({ color: "#00e5ff" }),
        stroke: new ol.style.Stroke({ color: "#0a0b0d", width: 3 }),
        backgroundFill: new ol.style.Fill({ color: "rgba(22,23,26,0.8)" }),
        padding: [1, 4, 1, 4]
      })
    });
  }
});

// Airports: orange squares
const aptLayer = new ol.layer.Vector({
  source: aptSource,
  style: (feature) => {
    const id = feature.get("id") || "";
    return new ol.style.Style({
      image: new ol.style.RegularShape({
        points: 4,
        radius: 7,
        angle: Math.PI / 4,
        fill: new ol.style.Fill({ color: "#ff9800" }),
        stroke: new ol.style.Stroke({ color: "#16171a", width: 1.5 })
      }),
      text: new ol.style.Text({
        text: id,
        offsetY: -16,
        font: "700 11px 'Segoe UI', sans-serif",
        fill: new ol.style.Fill({ color: "#ff9800" }),
        stroke: new ol.style.Stroke({ color: "#0a0b0d", width: 3 }),
        backgroundFill: new ol.style.Fill({ color: "rgba(22,23,26,0.85)" }),
        padding: [2, 6, 2, 6]
      })
    });
  }
});

// Alternate: purple dashed
const altLayer = new ol.layer.Vector({
  source: altSource,
  style: new ol.style.Style({
    stroke: new ol.style.Stroke({
      color: "#b266ff",
      width: 2,
      lineDash: [8, 6]
    })
  })
});

// Dark matte base tiles (CartoDB dark_matter)
const baseLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({
    url: "https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    attributions: "© OpenStreetMap contributors © CARTO",
    maxZoom: 19
  })
});

const map = new ol.Map({
  target: "map",
  layers: [baseLayer, altLayer, routeLayer, wptLayer, aptLayer],
  view: new ol.View({
    center: ol.proj.fromLonLat([10.0, 50.0]),
    zoom: 5,
    minZoom: 2,
    maxZoom: 16
  }),
  controls: ol.control.defaults.defaults({
    attributionOptions: { collapsible: true }
  }).extend([
    new ol.control.ScaleLine({ units: "nautical" })
  ])
});

// Fix OL default controls API across versions
// (ol.control.defaults.defaults is v7+; for v9 it's ol.control.defaults.defaults)
// Already using v9 form above.

/* ============================================================
   Route rendering helpers
   ============================================================ */

function clearLayers() {
  routeSource.clear();
  wptSource.clear();
  aptSource.clear();
  altSource.clear();
}

function addAirport(lon, lat, ident) {
  if (typeof lon !== "number" || typeof lat !== "number") return;
  const f = new ol.Feature({
    geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
    id: ident || ""
  });
  aptSource.addFeature(f);
}

function addWaypoint(lon, lat, ident) {
  if (typeof lon !== "number" || typeof lat !== "number") return;
  const f = new ol.Feature({
    geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
    id: ident || ""
  });
  wptSource.addFeature(f);
}

function addRouteLine(coords) {
  // coords: array of [lon, lat]
  if (!coords || coords.length < 2) return;
  const pts = coords.map(c => ol.proj.fromLonLat([c[0], c[1]]));
  const line = new ol.geom.LineString(pts);
  routeSource.addFeature(new ol.Feature({ geometry: line }));
}

function addAlternateLine(from, to) {
  if (!from || !to) return;
  const pts = [from, to].map(c => ol.proj.fromLonLat([c[0], c[1]]));
  const line = new ol.geom.LineString(pts);
  altSource.addFeature(new ol.Feature({ geometry: line }));
}

function fitToAll() {
  // Collect extent across all vector sources
  let extent = null;
  [routeSource, wptSource, aptSource, altSource].forEach(src => {
    const e = src.getExtent();
    if (e && e.length === 4 && isFinite(e[0])) {
      if (!extent) extent = e.slice();
      else {
        extent[0] = Math.min(extent[0], e[0]);
        extent[1] = Math.min(extent[1], e[1]);
        extent[2] = Math.max(extent[2], e[2]);
        extent[3] = Math.max(extent[3], e[3]);
      }
    }
  });
  if (extent) {
    map.getView().fit(extent, {
      padding: [60, 60, 60, 60],
      duration: 700,
      maxZoom: 10
    });
  }
}

/* ============================================================
   OFP rendering
   ============================================================ */

function renderOFP(data) {
  const dep = ($("dep").value || "").toUpperCase();
  const arr = ($("arr").value || "").toUpperCase();
  const ac  = $("ac").value;
  const pax = $("pax").value;
  const cargo = $("cargo").value;

  const lines = [];
  lines.push("================================================");
  lines.push("  FLYBRIEF OFP — COMPUTER GENERATED FLIGHT PLAN");
  lines.push("================================================");
  lines.push(`  ROUTE      : ${dep} -> ${arr}`);
  lines.push(`  AIRCRAFT   : ${ac}`);
  lines.push(`  PAX        : ${pax}`);
  lines.push(`  CARGO      : ${cargo} kg`);
  lines.push("------------------------------------------------");

  if (data.distance_nm != null) {
    lines.push(`  DISTANCE   : ${data.distance_nm} NM`);
  }
  if (data.cruise_fl != null) {
    lines.push(`  CRUISE FL  : FL${data.cruise_fl}`);
  }
  if (data.ete) {
    lines.push(`  ETE        : ${data.ete}`);
  }
  if (data.fuel_kg != null) {
    lines.push(`  FUEL       : ${data.fuel_kg} KG`);
  }
  if (data.zfw_kg != null) {
    lines.push(`  ZFW        : ${data.zfw_kg} KG`);
  }
  if (data.tow_kg != null) {
    lines.push(`  TOW        : ${data.tow_kg} KG`);
  }
  if (data.alternate) {
    lines.push(`  ALTERNATE  : ${data.alternate}`);
  }
  if (data.metar_dep) {
    lines.push("------------------------------------------------");
    lines.push(`  METAR ${dep}:`);
    lines.push(`  ${data.metar_dep}`);
  }
  if (data.metar_arr) {
    lines.push(`  METAR ${arr}:`);
    lines.push(`  ${data.metar_arr}`);
  }
  lines.push("------------------------------------------------");
  if (Array.isArray(data.route) && data.route.length) {
    lines.push("  ROUTE:");
    lines.push("  " + data.route.join(" "));
  } else if (Array.isArray(data.waypoints) && data.waypoints.length) {
    lines.push("  WAYPOINTS:");
    lines.push("  " + data.waypoints.map(w => w.id || w.name || "?").join(" "));
  }
  lines.push("================================================");
  lines.push("  END OF FLIGHT PLAN — FlyBrief");
  lines.push("================================================");

  setOFP(lines.join("\n"), false);
}

/* ============================================================
   Backend calls
   ============================================================ */

async function calc() {
  const dep = ($("dep").value || "").trim().toUpperCase();
  const arr = ($("arr").value || "").trim().toUpperCase();
  const ac  = $("ac").value;

  if (!dep || !arr) {
    setOFP("// ERROR: Departure and Arrival required.", true);
    return;
  }
  if (dep.length !== 4 || arr.length !== 4) {
    setOFP("// ERROR: ICAO codes must be 4 characters.", true);
    return;
  }

  $("calcBtn").disabled = true;
  $("dlBtn").disabled = true;
  setOFP("// Generating flight plan...\n// Querying backend...", false);

  const url = `${API_BASE}/calculate?dep=${encodeURIComponent(dep)}&arr=${encodeURIComponent(arr)}&ac=${encodeURIComponent(ac)}`;

  try {
    const res = await fetch(url, { method: "GET" });
    if (!res.ok) {
      throw new Error(`HTTP ${res.status} ${res.statusText}`);
    }
    const data = await res.json();

    // ---- Render OFP text ----
    renderOFP(data);

    // ---- Render map ----
    clearLayers();

    // Route path: data.path = [[lon,lat],[lon,lat],...]
    if (Array.isArray(data.path) && data.path.length >= 2) {
      addRouteLine(data.path);

      // Airports at start & end
      addAirport(data.path[0][0], data.path[0][1], dep);
      addAirport(data.path[data.path.length - 1][0], data.path[data.path.length - 1][1], arr);
    } else if (data.dep_lat != null && data.arr_lat != null) {
      // Fallback if backend returns only endpoints
      addAirport(data.dep_lon, data.dep_lat, dep);
      addAirport(data.arr_lon, data.arr_lat, arr);
      addRouteLine([[data.dep_lon, data.dep_lat], [data.arr_lon, data.arr_lat]]);
    }

    // Waypoints
    // Support: data.waypoints = [{id, lon, lat}, ...] OR data.waypoints = [[lon,lat,id],...]
    if (Array.isArray(data.waypoints)) {
      data.waypoints.forEach(w => {
        if (Array.isArray(w) && w.length >= 2) {
          addWaypoint(w[0], w[1], w[2] || "");
        } else if (w && typeof w === "object") {
          addWaypoint(w.lon, w.lat, w.id || w.name || "");
        }
      });
    }

    // Alternate (purple dashed from arrival to alt)
    if (data.alt_lat != null && data.alt_lon != null) {
      let arrCoord = null;
      if (Array.isArray(data.path) && data.path.length) {
        arrCoord = data.path[data.path.length - 1];
      } else if (data.arr_lon != null && data.arr_lat != null) {
        arrCoord = [data.arr_lon, data.arr_lat];
      }
      if (arrCoord) {
        addAlternateLine(arrCoord, [data.alt_lon, data.alt_lat]);
        addAirport(data.alt_lon, data.alt_lat, data.alternate || "ALTN");
      }
    }

    fitToAll();

    $("dlBtn").disabled = false;

  } catch (err) {
    console.error(err);
    setOFP(
      "// ERROR: Failed to generate flight plan.\n" +
      "// " + (err && err.message ? err.message : String(err)) + "\n" +
      "// Check backend availability and /calculate endpoint.",
      true
    );
  } finally {
    $("calcBtn").disabled = false;
  }
}

function downloadPln() {
  const dep = ($("dep").value || "").trim().toUpperCase();
  const arr = ($("arr").value || "").trim().toUpperCase();

  if (!dep || !arr) {
    setOFP("// ERROR: Departure and Arrival required.", true);
    return;
  }

  const url = `${API_BASE}/download_pln?dep=${encodeURIComponent(dep)}&arr=${encodeURIComponent(arr)}`;

  // Trigger browser download
  const a = document.createElement("a");
  a.href = url;
  a.download = `${dep}-${arr}.pln`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ============================================================
   Init
   ============================================================ */

// Initial soft load (auto-generate on page load using defaults)
window.addEventListener("load", () => {
  // Дать карте время отрисоваться, затем дернуть дефолтный план
  setTimeout(() => {
    calc();
  }, 300);
});

// Enter key shortcut in inputs
["dep", "arr", "pax", "cargo", "ac"].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      calc();
    }
  });
});
</script>

</body>
</html>
